  <line
    x1="156"
    y1="126"
    x2="156"
    y2="34"
    stroke="#2fae6a"
    stroke-width="1.8"
    stroke-dasharray="5 4"
  />
  <polygon points="156,29 152.5,35 159.5,35" fill="#2fae6a" />
  <text
    x="164"
    y="35"
    fill="#2fae6a"
    font-family="Barlow, sans-serif"
    font-size="9"
    font-weight="600"
    letter-spacing="1.2"
  >BAR PATH</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177 90 L174 111 L177 129.5 L169 129.5" stroke="#6b7682" stroke-width="3.5" />
    <path d="M174 90 L169 111 L172 129.5 L163 129.5" stroke="#97a3b0" stroke-width="3.8" />
    <path d="M170 59 L174 90" stroke="#97a3b0" stroke-width="5" />
    <circle cx="169" cy="48" r="6.2" fill="#97a3b0" stroke="none" />
    <path d="M169 60 L159 71 L156 88" stroke="#97a3b0" stroke-width="3.2" />
  </g>

  <g>
    <line x1="143" y1="88" x2="168" y2="88" stroke="#eff2f5" stroke-width="2.8" stroke-linecap="round" />
    <rect x="146" y="79" width="4.5" height="18" rx="0.8" fill="#f2c230" />
    <rect x="161.5" y="79" width="4.5" height="18" rx="0.8" fill="#f2c230" />
    <circle cx="156" cy="88" r="2.4" fill="#eff2f5" />
  </g>

  <path
    d="M60 83 L134 65 M60 93 L134 111"
    stroke="#2a7fe0"
    stroke-width="1"
    opacity="0.28"
  />
  <line
    x1="60"
    y1="88"
    x2="133"
    y2="88"
    stroke="#2a7fe0"
    stroke-width="1.5"
    stroke-dasharray="4 3"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Filming guide: film from square to the side, 3 to 5 metres away, camera at hip height, level with the platform, with the whole bar in frame.</title>

  <rect width="320" height="180" fill="#12171c" />

  <rect x="14" y="132" width="292" height="34" fill="#0c0f12" />
  <rect
    x="14"
    y="14"
    width="292"
    height="152"
    fill="none"
    stroke="#3d4752"
    stroke-width="1.2"
    stroke-dasharray="6 5"
  />
  <text
    x="22"
    y="28"
    fill="#6b7682"
    font-family="Barlow, sans-serif"
    font-size="9"
    font-weight="600"
    letter-spacing="1.4"
  >WHOLE BAR IN FRAME</text>

  <line
    x1="14"
    y1="132"
    x2="306"
    y2="132"
    stroke="#f2c230"
    stroke-width="1.2"
    stroke-dasharray="4 4"
  />
  <text
    x="262"
    y="126"
    fill="#f2c230"
    font-family="Barlow, sans-serif"
    font-size="9"
    font-weight="600"
    letter-spacing="1.2"

    <rect x="32" y="73" width="8" height="3" rx="1" fill="#3d4752" />
    <circle cx="42" cy="88" r="6.5" fill="#12171c" stroke="#2a7fe0" stroke-width="1.8" />
    <circle cx="42" cy="88" r="2.8" fill="#2a7fe0" />
  </g>
  <text
    x="24"
    y="113"
    fill="#6b7682"
    font-family="Barlow, sans-serif"
    font-size="9"
    font-weight="600"
